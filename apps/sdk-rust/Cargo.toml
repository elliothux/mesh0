[package]
name = "mesh0"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Mesh0 agent orchestration"
license = "MIT"
repository = "https://github.com/elliothux/mesh0"
homepage = "https://mesh0.run"
publish = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "3.3.0", features = ["json"] }
